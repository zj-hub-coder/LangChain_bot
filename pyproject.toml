[project]
name = "k8s-ops-agent"
version = "0.1.0"
description = "面向 SRE 的 Kubernetes 运维助手 Agent（MCP 接入集群 + 内置搜索 + CLI 交互）"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "duckduckgo-search>=6.0",
]

[project.scripts]
# 安装后可直接 `k8s-ops-agent` 启动 CLI
k8s-ops-agent = "cli:chat_sync"

[project.optional-dependencies]
# 评估与门禁开发依赖
dev = [
    "pytest>=8.0",
]
# 自托管 Langfuse 可观测后端（不配 LANGFUSE_ENABLED 时无需安装）
observability = [
    "langfuse>=3.0",
]

[tool.setuptools]
packages = ["tools", "evals", "observability", "experiences"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
