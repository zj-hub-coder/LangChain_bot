name: Agent Eval Gate

# AgentLoop 变更门禁：push/PR 时自动验证
# 1) 评估器自身的离线单测（零外部依赖，硬门禁）
# 2) 不依赖真实集群的 Agent 样本评估（需配置 LLM API Key secret；未配置则跳过）
# 集群类样本（requires_cluster=true）只在本地/有集群环境用 run_eval 全量评估

on:
  push:
    branches: [main]
  pull_request:

jobs:
  judge-unit:
    name: Rule Judge 单测（硬门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖（含 dev）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 数据集快照校验
        # load_dataset 会按 manifest.json 校验 sha256，样本被篡改/未重新冻结即失败
        run: python -c "from evals.dataset import load_all; load_all()"
      - name: 运行 RuleJudge 单测
        run: pytest tests/

  secret-gate:
    name: 检查 LLM API Key 是否配置
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.gate.outputs.has_key }}
    steps:
      - id: gate
        env:
          _KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  agent-eval-offline:
    name: Agent 离线样本评估（质量门禁）
    runs-on: ubuntu-latest
    needs: [judge-unit, secret-gate]
    # 未配置 LLM API Key 时自动跳过（fork/公开仓库场景）
    if: ${{ needs.secret-gate.outputs.has_key == 'true' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      TRACE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 置空 MCP 配置（CI 无集群/MCP 子进程）
        # 离线样本不依赖集群工具；空配置让 Agent 以"仅内置工具"模式装配
        run: echo '{}' > mcp_servers.json
      - name: 跑离线评估（门禁阈值 80）
        run: >
          python -m evals.run_eval
          --datasets baseline,test,regression
          --offline-only --timeout 60 --fail-under 80
      - name: 上传评估报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: ignore
